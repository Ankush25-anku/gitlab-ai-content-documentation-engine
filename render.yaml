# Render blueprint for the backend. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: content-engine-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Capstone demo: staging + dev auth so evaluators can sign in as demo users.
      # For real accounts use APP_ENV=production and AUTH_MODE=supabase (see deployment/environment_setup.md).
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: dev
      - key: LLM_PROVIDER
        value: crewai
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: LLM_MODEL_DRAFT
        sync: false
      - key: LLM_MODEL_REVIEW
        sync: false
      - key: GITLAB_URL
        value: https://gitlab.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GITLAB_PROJECT_ID
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
